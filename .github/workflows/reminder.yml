name: Send WA Reminders

on:
  schedule:
    # Berjalan setiap 15 menit (UTC). Sesuaikan kebutuhan agar tidak boros menit GitHub Actions.
    - cron: "*/15 * * * *"
  # Memungkinkan kamu menekan tombol "Run workflow" secara manual untuk mengetes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run reminder script
        env:
          WA_API_URL: ${{ secrets.WA_API_URL }}
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
        run: npm run send-reminders

      - name: Commit updated reminders.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reminders.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent status in reminders.json"
            git push
          fi
